name: Build Hesabaty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Hesabaty_Android_Project.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          cd project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "لم يتم العثور على gradlew داخل المشروع"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabaty-APK
          path: project/**/build/outputs/apk/**/*.apk
  
