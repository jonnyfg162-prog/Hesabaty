name: Build Hesabaty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Hesabaty_Android_Project.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle -type f -print -quit | xargs -r dirname)
          if [ -z "$PROJECT" ]; then echo "Android project not found"; exit 1; fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabaty-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
